apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumdemoapp-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: seleniumdemoapp
  template:
    metadata:
      labels:
        app: seleniumdemoapp
    spec:
      containers:
        - name: seleniumdemoapp
          image: akshayaaaaaaaaaaaaaaaaaaaaaaa/selenium # use your Docker Hub image
          ports:
            - containerPort: 5000